name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/core build
      - run: bun run --cwd desktop build
      - run: bun run --cwd desktop check:renderer-no-node
      - name: Package
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          signing=()
          [ -n "$CSC_LINK" ] || signing=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          bunx electron-builder --mac --universal --publish never \
            -c.extraMetadata.version="${GITHUB_REF_NAME#v}" "${signing[@]}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes desktop/release.noindex/*.dmg desktop/release.noindex/*.zip
